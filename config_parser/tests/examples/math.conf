<#
Mathematical configuration
Demonstrates complex expressions
#>

PI := 3.1415926535;
E := 2.7182818284;

RADIUS := 5;
AREA := .[PI RADIUS RADIUS * *].;
VOLUME := .[AREA RADIUS * 4 * 3 /].;

struct {
    Circle = struct {
        Radius = RADIUS,
        Area = AREA
    },
    Sphere = struct {
        Radius = RADIUS,
        Volume = VOLUME
    },
    Constants = struct {
        Pi = PI,
        Euler = E,
        Golden_ratio = .[1 5 sqrt + 2 /].,
    },
    Trigonometry = struct {
        Sin_30 = .[0.5].,
        Cos_60 = .[0.5].,
        Tan_45 = .[1.0].,
    }
}