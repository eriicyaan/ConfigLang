<#
Game configuration
RPG character statistics
#>

BASE_STR := 10;
BASE_DEX := 10;
BASE_INT := 15;

STR_BONUS := .[BASE_STR 0.2 *].;
DEX_BONUS := .[BASE_DEX 0.3 *].;
INT_BONUS := .[BASE_INT 0.5 *].;

DAMAGE := .[BASE_STR STR_BONUS + 2 *].;
HEAL_AMOUNT := .[BASE_INT INT_BONUS + 1.5 *].;

struct {
    Character = struct {
        Name = "Thalorin",
        Class = "Paladin",
        Level = 25,
        Stats = struct {
            Strength = .[BASE_STR STR_BONUS +].,
            Dexterity = .[BASE_DEX DEX_BONUS +].,
            Intelligence = .[BASE_INT INT_BONUS +].,
            Health = .[100 BASE_STR *].,
            Mana = .[50 BASE_INT *].,
        },
        Abilities = struct {
            Slash = struct {
                Name = "Power Slash",
                Damage = DAMAGE,
                Cooldown = 5
            },
            Heal = struct {
                Name = "Divine Light",
                Heal_amount = HEAL_AMOUNT,
                Mana_cost = 30
            }
        },
        Equipment = struct {
            Weapon = "Sword of Dawn",
            Armor = "Plate Armor"
        }
    }
}