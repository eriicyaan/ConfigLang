            Value = LEVEL1,
            Level2 = struct {
                Value = LEVEL2,
                Level3 = struct {
                    Value = LEVEL3,
                    Level4 = struct {
                        Final = .[LEVEL3 5 *].,
                    }
                }
            }
        }
    }
}